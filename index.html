<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lior's Pages</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --paper: #eef1f5;
    --surface: #ffffff;
    --surface-sunken: #e3e7ee;
    --ink: #1c222b;
    --ink-soft: #4d5766;
    --ink-faint: #808a99;
    --line: #d3d9e2;
    --accent: #c8631a;
    --accent-soft: #f3e3d3;
    --shadow: 0 1px 2px rgba(28, 34, 43, 0.06), 0 8px 24px rgba(28, 34, 43, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #12161c;
      --surface: #1a1f27;
      --surface-sunken: #10141a;
      --ink: #e9ecf1;
      --ink-soft: #a7b0bf;
      --ink-faint: #707a8a;
      --line: #2b323d;
      --accent: #e2914f;
      --accent-soft: #3a2a17;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #12161c;
    --surface: #1a1f27;
    --surface-sunken: #10141a;
    --ink: #e9ecf1;
    --ink-soft: #a7b0bf;
    --ink-faint: #707a8a;
    --line: #2b323d;
    --accent: #e2914f;
    --accent-soft: #3a2a17;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .shell { width: 100%; max-width: 420px; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  p.lede {
    color: var(--ink-soft);
    margin: 0 0 24px;
    font-size: 14px;
  }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  a.app-link {
    display: flex;
    flex-direction: column;
    gap: 3px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 16px 18px;
    text-decoration: none;
    color: var(--ink);
  }
  a.app-link:hover { border-color: var(--accent); }
  a.app-link .name { font-weight: 600; font-size: 15px; }
  a.app-link .desc { font-size: 13px; color: var(--ink-soft); }
  footer {
    margin-top: 24px;
    font-size: 12px;
    color: var(--ink-faint);
    font-family: "IBM Plex Mono", monospace;
  }
</style>
</head>
<body>
<div class="shell">
  <h1>Lior's Pages</h1>
  <p class="lede">Small single-page apps, hosted here.</p>
  <ul>
    <li>
      <a class="app-link" href="curfew-console/">
        <span class="name">Curfew Console</span>
        <span class="desc">Hour picker for the laptop auto-lock schedule</span>
      </a>
    </li>
  </ul>
  <footer>liorhal/lior-pages</footer>
</div>
</body>
</html>
