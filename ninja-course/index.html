<!doctype html>
<html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>מסלול הנינג'ה של אלעד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: night arena. A 3D stage on top (sticky while running), one question card under it. Single dark look by choice. */
:root{
  color-scheme:dark;
  --bg:#080D1C; --surface:#131B33; --ink:#EEF3FF; --muted:#93A0C0; --line:#2A3660; --chip:#1B2545;
  --accent:#FF6B1A; --cy:#27D3F5; --gold:#FFC53D; --gold-ink:#2E1F00; --red:#FF5A4F;
  --good:#3DDC84; --good-bg:#0F3020; --bad:#FF6B6B; --bad-bg:#3A1A20;
  --shade:#4E78E6; --wood:#7A5230; --woodtop:#A8733F; --ninja:#060A16; --skin:#E7B58A;
  --plate:#1E2A4D; --crust:#D99A4E; --cheese:#F7C948; --pepp:#C8402E; --sun:#FFC53D; --sun-ink:#2E1F00;
  --display:'Karantina','Rubik',system-ui,sans-serif; --body:'Rubik',system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:radial-gradient(1200px 500px at 50% -120px,#17306a 0%,transparent 70%);background-repeat:no-repeat;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 44px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:640px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}

h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;line-height:1;letter-spacing:.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-weight:700}
.ltr{direction:ltr;unicode-bidi:isolate}

/* brand */
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{font-size:clamp(40px,11vw,58px);transform:skewX(-6deg)}
.brand h1 span{color:var(--accent)}
.brand .tag{font-size:13px;color:var(--muted);letter-spacing:.06em;padding-bottom:6px;white-space:nowrap}

/* stage */
#stage{position:relative;border-radius:20px;overflow:hidden;background:#060a16;border:2px solid var(--line);z-index:5;box-shadow:0 14px 40px rgba(0,0,0,.45)}
#stage.run{position:sticky;top:calc(env(safe-area-inset-top,0px) + 6px)}
#gl{display:block;width:100%;aspect-ratio:16/9;touch-action:manipulation}
#stage.no3d #gl{display:none}
#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:8px}
#stage.no3d #hud{position:static;gap:10px}
.hrow{display:flex;align-items:center;gap:8px}
.hrow>*{pointer-events:auto}
.hrow .sp{flex:1}
.hb{width:38px;height:38px;border-radius:50%;background:rgba(8,13,28,.62);border:1.5px solid rgba(255,255,255,.18);display:grid;place-items:center;flex:none;backdrop-filter:blur(6px)}
.hb svg{width:18px;height:18px}
.chipc{display:inline-flex;align-items:center;gap:5px;background:rgba(8,13,28,.62);border:1.5px solid rgba(255,255,255,.18);border-radius:99px;padding:4px 11px 4px 9px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px);white-space:nowrap}
.chipc svg{width:17px;height:17px;flex:none}
.chipc.hot{border-color:var(--accent);color:var(--gold)}
.chipc small{font-weight:500;color:var(--muted)}
.pips{flex:1;display:flex;gap:4px;min-width:0;direction:ltr}
.pips i{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.2)}
.pips i.ok{background:var(--good)} .pips i.no{background:var(--cy);opacity:.75} .pips i.cur{background:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.35}}
.rank{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.rank .rk{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rank .rk b{font-family:var(--display);font-size:32px;line-height:1;color:var(--gold)}
.rank .rk span{font-size:13px;color:var(--muted)}
.xp{height:8px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;direction:ltr}
.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:5px}
#cap{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,56px);line-height:1;pointer-events:none;opacity:0;transform:skewX(-8deg);text-shadow:0 3px 0 rgba(0,0,0,.55),0 0 22px rgba(0,0,0,.6)}
#cap.ok{color:var(--gold)} #cap.no{color:var(--cy)}
#cap.go{animation:cap 1.5s ease-out}
@keyframes cap{0%{opacity:0;transform:skewX(-8deg) scale(.5)}12%{opacity:1;transform:skewX(-8deg) scale(1.12)}22%{transform:skewX(-8deg) scale(1)}75%{opacity:1}100%{opacity:0;transform:skewX(-8deg) translateY(-14px)}}
#stage.no3d #cap{position:static;opacity:1;font-size:26px;min-height:0}
#stage.no3d #cap.go{animation:none}

/* shared blocks */
.label{font-size:13px;color:var(--muted);letter-spacing:.08em;font-weight:500}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.qtag{font-size:13px;font-weight:700;color:var(--cy);letter-spacing:.06em}
.big{background:var(--accent);color:#fff;border-radius:16px;padding:14px 18px;font-size:19px;font-weight:800;box-shadow:0 5px 0 #b3430a;text-align:center}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #b3430a}
.big:disabled{opacity:.45;cursor:default}
.ghost{background:var(--chip);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:700}
.link{color:var(--muted);text-decoration:underline;font-size:15px;align-self:center;padding:6px}
.btns{display:flex;flex-direction:column;gap:10px}

/* home */
.stglist{display:flex;flex-direction:column;gap:8px}
.stg{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px 10px 12px;position:relative;overflow:hidden}
.stg::after{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:5px;background:var(--line)}
.stg.s1::after{background:var(--cy)} .stg.s2::after{background:var(--accent)} .stg.s3::after{background:var(--gold)}
.stg .no{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;text-align:center;color:var(--ink);transform:skewX(-6deg)}
.stg b{display:block;font-size:17px}
.stg .ex{color:var(--muted);font-size:14px}
.stg .st{color:var(--gold);letter-spacing:2px;font-size:17px;white-space:nowrap}
.stg .st .off{color:var(--line)}
.final{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:start;border-radius:18px;padding:16px 18px;background:linear-gradient(100deg,#b3170f,#ff6b1a);color:#fff;box-shadow:0 5px 0 #7a0f0a}
.final b{font-family:var(--display);font-size:34px;line-height:1;display:block}
.final small{opacity:.9}
.final .bz{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9a8f,#e5262b 60%,#8f1215);border:4px solid #2b0d0d;flex:none}
.locker{display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0;background:var(--chip);border:1.5px solid var(--line);border-radius:16px;padding:12px 16px;font-weight:700;text-align:start}
.locker span{color:var(--muted);font-weight:400;font-size:14px;display:block}
.locker i{font-style:normal;color:var(--cy);font-weight:800;white-space:nowrap}
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.medal{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.medal svg{width:34px;height:auto}
.medal b{font-size:14px;line-height:1.2}
.medal span{font-size:12px;color:var(--muted);line-height:1.25}
.medal.off b{color:var(--muted)}

#obn{position:absolute;top:54px;left:50%;transform:translateX(-50%);background:rgba(8,13,28,.72);border:1.5px solid rgba(255,255,255,.18);border-radius:99px;padding:4px 14px;font-weight:700;font-size:14px;white-space:nowrap;opacity:0;transition:opacity .35s;pointer-events:none}
#obn.on{opacity:1}
#stage.no3d #obn{display:none}
/* paper workpad */
.padbtn{align-self:center}
.padw{display:flex;flex-direction:column;gap:10px}
.pad{--cw:clamp(26px,8.2vw,40px);direction:ltr;display:grid;gap:5px 3px;justify-content:center;padding:14px 10px;border-radius:14px;color:#1b2440;
  background:#f4f0e3;background-image:linear-gradient(#d3dbe8 1px,transparent 1px),linear-gradient(90deg,#d3dbe8 1px,transparent 1px);background-size:20px 20px;overflow-x:auto}
.pad input{width:100%;height:42px;border:2px dashed #97a3bf;border-radius:8px;background:rgba(255,255,255,.8);text-align:center;font:700 24px Rubik,system-ui,sans-serif;color:#1b2440;padding:0;min-width:0}
.pad input:focus{border-style:solid;border-color:#ff6b1a;outline:none;background:#fff}
.pad input.s{height:26px;font-size:15px;color:#d1342c;border-color:#e3a8a4;border-width:1.5px}
.pad .d{height:42px;display:grid;place-items:center;font:700 26px Rubik,system-ui,sans-serif;color:#1b2440;background:none;border:0;padding:0}
.pad button.d{cursor:pointer;border-radius:8px}
.pad button.d.x{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:#d1342c;color:#8a90a2}
.pad .op{height:42px;display:grid;place-items:center;font:800 24px Rubik,system-ui,sans-serif;color:#1b2440}
.pad .ln{grid-column:1/-1;height:3px;background:#1b2440;border-radius:2px}
.pad i{display:block}
table.col td.z{color:var(--muted)}
/* hub buttons, shop tabs, settings */
.duo,.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.duo .locker,.games .locker{flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:2px;border-inline-start:5px solid var(--accent)}
.locker.gem{border-inline-start-color:var(--cy)}
.games .wide{grid-column:1/-1}
/* camera game */
.cz-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cz-steps div{background:var(--chip);border-radius:12px;padding:10px;font-size:14px}
.cz-steps b{display:block;font-family:var(--display);font-size:28px;color:var(--gold);line-height:1}
@media (max-width:560px){.cz-steps{grid-template-columns:1fr}}
.cz{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;border:2px solid var(--line);user-select:none;touch-action:none}
#cz-video{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;transform:scaleX(-1);opacity:.55;filter:saturate(.8)}
#cz-fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cz-top{position:absolute;top:3%;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#cz-q{font-weight:800;font-size:clamp(34px,7vw,80px);direction:ltr;text-shadow:0 4px 0 rgba(0,0,0,.6);line-height:1}
#cz-prog{font-size:14px;color:var(--muted);background:rgba(8,13,28,.7);border-radius:99px;padding:2px 12px}
.cz-hud{position:absolute;top:3%;display:flex;gap:8px}.cz-hud.r{right:2%}.cz-hud.l{left:2%}
.cz-chip{background:rgba(8,13,28,.7);border:1.5px solid rgba(255,255,255,.2);border-radius:99px;padding:3px 10px;font-weight:800;font-size:14px}
.cz-bub{position:absolute;width:19%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);display:grid;place-items:center;font-weight:800;font-size:clamp(22px,4.6vw,56px);color:#fff;direction:ltr;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),transparent 45%),var(--c);box-shadow:0 0 0 4px rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.5);transition:transform .15s}
.cz-bub::before{content:"";position:absolute;inset:-9px;border-radius:50%;background:conic-gradient(#fff calc(var(--p,0)*1turn),transparent 0);-webkit-mask:radial-gradient(circle,transparent 62%,#000 63%);mask:radial-gradient(circle,transparent 62%,#000 63%)}
.cz-bub.hot{transform:translate(-50%,-50%) scale(1.1)}
.cz-bub.ok{animation:czok .55s forwards}
@keyframes czok{30%{transform:translate(-50%,-50%) scale(1.35)}100%{transform:translate(-50%,-50%) scale(0);opacity:0}}
.cz-bub.no{animation:czcr .5s forwards;filter:grayscale(1) brightness(.6)}
.cz-bub.no::after{content:"✕";position:absolute;font-size:1.4em;color:#ff4b4b;text-shadow:0 2px 0 #000}
@keyframes czcr{20%{transform:translate(-50%,-50%) rotate(-12deg) scale(.9)}40%{transform:translate(-50%,-50%) rotate(10deg) scale(.85)}60%{transform:translate(-50%,-50%) rotate(-6deg) scale(.82)}100%{transform:translate(-50%,-50%) scale(.8)}}
#cz-msg{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);background:rgba(8,13,28,.78);border-radius:14px;padding:6px 14px;font-weight:700;white-space:nowrap;pointer-events:none}
#cz-msg:empty{display:none}
#cz-cap{position:absolute;left:0;right:0;top:40%;text-align:center;font-family:var(--display);font-size:clamp(44px,9vw,100px);opacity:0;pointer-events:none;transform:skewX(-8deg);text-shadow:0 4px 0 rgba(0,0,0,.6)}
#cz-cap.czgo{animation:czcap 1.1s ease-out}#cz-cap.ok{color:var(--gold)}#cz-cap.no{color:var(--bad)}
@keyframes czcap{0%{opacity:0;transform:skewX(-8deg) scale(.5)}15%{opacity:1;transform:skewX(-8deg) scale(1.1)}75%{opacity:1}100%{opacity:0}}
#cz-flash{position:absolute;inset:0;pointer-events:none;opacity:0}
#cz-flash.ok{background:radial-gradient(circle at 50% 50%,transparent 40%,rgba(61,220,132,.55));animation:czfl .7s ease-out}
#cz-flash.no{background:radial-gradient(circle at 50% 50%,transparent 35%,rgba(255,40,40,.65));animation:czfl .6s ease-out}
@keyframes czfl{0%{opacity:1}100%{opacity:0}}
.cz.shake{animation:czsh .45s}
@keyframes czsh{15%{transform:translate(-12px,4px) rotate(-.6deg)}30%{transform:translate(10px,-5px) rotate(.5deg)}45%{transform:translate(-8px,3px)}60%{transform:translate(6px,-2px)}75%{transform:translate(-3px,1px)}}
.cz.glow{box-shadow:0 0 0 4px var(--good),0 0 50px rgba(61,220,132,.6)}
.cz.burn{box-shadow:0 0 0 4px var(--accent),0 0 60px rgba(255,107,26,.75)}
.cz-float{position:absolute;unicode-bidi:plaintext;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(32px,5.5vw,60px);pointer-events:none;animation:czup 1.1s ease-out forwards;text-shadow:0 3px 0 rgba(0,0,0,.6)}
.cz-float.ok{color:var(--gold)}.cz-float.no{color:var(--bad)}
@keyframes czup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
#cz-q.ok{color:var(--good);animation:czqb .5s}#cz-q.no{color:var(--bad);animation:czqn .4s}
@keyframes czqb{40%{transform:scale(1.2)}}@keyframes czqn{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
/* the camera stage gets the full width on desktop */
.wrap.solo:has(.cz){max-width:1000px}
.locker b{font-size:17px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:1 0 auto;background:var(--chip);border:1.5px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:700;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#modal{position:fixed;inset:0;z-index:40;background:rgba(4,7,16,.78);display:grid;place-items:center;overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border:1.5px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:10px}
.sheet h2{font-size:38px}
.sheet textarea{font:500 13px/1.4 ui-monospace,monospace;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--chip);color:var(--ink);width:100%;direction:ltr;resize:vertical;word-break:break-all}
.sheet input{font:inherit;font-size:20px;font-weight:700;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--chip);color:var(--ink);width:100%}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:var(--chip);border:2px solid var(--line);border-radius:12px;padding:10px 6px;font-weight:700}
.seg button.on{border-color:var(--cy);background:#123a52}
/* multiplication games */
.tabsel{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:5px}
.tabsel button{background:var(--chip);border:2px solid var(--line);border-radius:10px;padding:8px 0;font-weight:800;font-variant-numeric:tabular-nums}
.tabsel button.on{background:var(--cy);border-color:var(--cy);color:#04222c}
.grid10{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;direction:ltr}
.grid10 i{font-style:normal;text-align:center;font-size:12px;font-weight:700;padding:6px 0;border-radius:5px;font-variant-numeric:tabular-nums;background:var(--chip);color:var(--muted)}
.grid10 i.h{background:none;color:var(--ink)}
.grid10 .l1,.legend .l1{background:#7a2530;color:#ffd9dc}.grid10 .l2,.legend .l2{background:#7a5a12;color:#fff0c4}.grid10 .l3,.legend .l3{background:#17643a;color:#d6ffe6}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--chip);display:inline-block}
.mq{font-size:clamp(44px,13vw,68px);font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;padding:6px 0}
.gemwin{display:flex;justify-content:center;align-items:center;gap:8px;font-family:var(--display);font-size:60px;line-height:1;color:var(--cy)}
.gemwin svg{width:44px;height:44px}
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mc{aspect-ratio:4/3;border-radius:14px;background:linear-gradient(135deg,#1a2a5c,#101a3a);border:2px solid var(--line);font-size:clamp(20px,6vw,28px);font-weight:800}
.mc span{visibility:hidden}
.mc.up{background:var(--chip);border-color:var(--cy)}.mc.up span{visibility:visible}
.mc.ok{background:var(--good-bg);border-color:var(--good)}
.bal{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:14px 0 6px}
.bn{width:62px;height:76px;border-radius:50% 50% 48% 48%/56% 56% 44% 44%;background:var(--c);color:#10131c;font-weight:800;font-size:22px;position:relative;animation:bob2 2.2s ease-in-out infinite;box-shadow:inset -6px -8px 0 rgba(0,0,0,.14)}
.bn::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:18px;background:var(--muted)}
.bn.pop{animation:popb .4s forwards}.bn.dud{opacity:.3;animation:none}
@keyframes bob2{50%{transform:translateY(-9px)}}
@keyframes popb{40%{transform:scale(1.35)}100%{transform:scale(0);opacity:0}}
/* shop items */
.kits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kit{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;text-align:start}
.kit.sel{border-color:var(--cy)}
.kit svg{width:40px;height:40px}
.kit b{display:block;line-height:1.2}
.kit span{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.kit span svg{width:13px;height:13px}
.kit span.own{color:var(--good)}

/* lesson */
.top{display:flex;align-items:center;gap:10px}
.top h2{flex:1;font-size:32px;min-width:0}
.top .hb{background:var(--chip);border-color:var(--line)}
.story-card{background:linear-gradient(100deg,#12224d,#131b33);border:1.5px solid var(--line);border-inline-start:5px solid var(--accent);border-radius:16px;padding:12px 16px}
.story-card .label{color:var(--accent)}
.lt{font-size:32px}
.lbody{display:flex;flex-direction:column;gap:12px}
.rule{background:var(--chip);border-inline-start:5px solid var(--gold);border-radius:10px;padding:10px 12px;font-weight:600}
.trap{background:var(--bad-bg);border-radius:12px;padding:10px 12px}
.trap b{color:var(--bad)}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent);width:22px;border-radius:9px}
.lnav{display:flex;gap:10px}
.lnav .big{flex:1}
.stepbox{background:var(--chip);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:96px}
.ok-msg{color:var(--good);font-weight:700}
.ctrl{display:flex;align-items:center;justify-content:center;gap:14px}
.ctrl .pm{width:52px;height:52px;border-radius:14px;background:var(--gold);color:var(--gold-ink);font-size:28px;font-weight:800;box-shadow:0 4px 0 #a87a12}
.ctrl .val{font-size:30px;font-weight:800;min-width:2em;text-align:center}
input[type=range]{width:100%;accent-color:var(--accent)}
.door{display:flex;justify-content:center}
.door svg{width:120px;height:auto}
.door .leaf{transition:transform .6s;transform-origin:20px 10px;transform-box:fill-box}
.qdoor.open .leaf,.door.open .leaf{transform:scaleX(.15)}
.qdoor svg{width:76px}
.qdoor.shake svg{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bills{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;direction:ltr}
.bills svg{height:auto}
.bills .grid10{display:grid;grid-template-columns:repeat(5,auto);gap:4px}
table.col{border-collapse:collapse;margin:0 auto;direction:ltr;font-variant-numeric:tabular-nums}
table.col td{width:38px;text-align:center;font-size:26px;font-weight:800;padding:0 2px;height:36px}
table.col tr.br td{font-size:15px;color:var(--red);height:20px}
table.col tr.res td{border-top:3px solid var(--ink)}
table.col s{color:var(--muted);text-decoration-thickness:2px}
table.col td.sfx{font-size:20px;color:var(--muted);width:auto;padding-left:4px}
table.col td.hl{background:var(--chip);border-radius:8px}
table.col.sm td{width:30px;font-size:22px;height:30px}
table.col.sm tr.br td{font-size:14px;height:18px}
table.col td.gp{padding-left:12px}

/* question */
.qtext{font-size:19px;font-weight:700;text-wrap:balance}
.qtext em{font-style:normal;background:var(--gold);color:var(--gold-ink);padding:0 .25em;border-radius:5px}
.story{background:var(--chip);border-radius:12px;padding:12px 14px}
.eq{font-size:clamp(22px,6.5vw,30px);text-align:center;direction:ltr;unicode-bidi:isolate;font-weight:700;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:.3em;font-variant-numeric:tabular-nums}
.eqs{direction:ltr;unicode-bidi:isolate;text-align:center;font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:.25em;margin:2px 0}
.box{display:inline-grid;place-items:center;min-width:1.6em;height:1.4em;border:3px dashed var(--accent);border-radius:8px;color:var(--accent);padding:0 .2em}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-weight:700;margin:0 .1em;font-size:.9em}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
.mx{display:inline-flex;align-items:center;gap:.08em;direction:ltr;unicode-bidi:isolate}
.sign{display:inline-grid;place-items:center;width:1.4em;height:1.4em;border:3px solid var(--red);border-radius:50%;color:var(--red)}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{background:var(--chip);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:18px;font-weight:600;text-align:center;min-height:56px}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.inrow{display:flex;gap:10px}
.inrow input{flex:1;min-width:0;font:inherit;font-size:26px;font-weight:700;text-align:center;direction:ltr;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--chip);color:var(--ink)}
.go{background:var(--accent);color:#fff;font-weight:800;border-radius:14px;padding:12px 20px;font-size:18px;box-shadow:0 4px 0 #b3430a}
.go:disabled{opacity:.5;cursor:default}
.hint{font-size:14px;color:var(--muted);text-align:center}
.pic{display:flex;justify-content:center;overflow-x:auto}
.pic svg{max-width:100%;height:auto}
.receipt{background:var(--plate);border:2px dashed var(--line);border-radius:6px;padding:10px 14px;max-width:280px;margin:0 auto;width:100%;font-size:16px}
.receipt .rh{text-align:center;font-weight:800;border-bottom:2px dashed var(--line);padding-bottom:6px;margin-bottom:6px}
.receipt .rr{display:flex;justify-content:space-between;gap:10px}
.fb{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;animation:pop .25s ease-out;scroll-margin-top:300px}
.fb.ok{background:var(--good-bg);border:2px solid var(--good)}
.fb.no{background:var(--bad-bg);border:2px solid var(--bad)}
.fb h2{font-size:34px}
.fb.ok h2{color:var(--good)} .fb.no h2{color:var(--bad)}
.fb h2 small{font-family:var(--body);font-size:15px;font-weight:700;color:var(--gold)}
.fb>div{display:flex;flex-direction:column;gap:6px}
.next{background:var(--ink);color:var(--bg);border-radius:14px;padding:14px;font-weight:800;font-size:19px}
.wait{text-align:center;color:var(--muted);font-size:14px}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}

/* results */
.stars{font-size:54px;letter-spacing:8px;text-align:center;color:var(--gold);line-height:1}
.stars span{display:inline-block;animation:starin .5s backwards}
.stars span:nth-child(2){animation-delay:.18s}.stars span:nth-child(3){animation-delay:.36s}
.stars .off{color:var(--line)}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}60%{transform:scale(1.3)}to{transform:none}}
.res{text-align:center;color:var(--muted)}
.res b{font-size:44px;color:var(--ink);display:block;font-family:var(--display);line-height:1}
.pay{display:flex;flex-direction:column;gap:4px;background:var(--chip);border-radius:12px;padding:10px 14px}
.pay div{display:flex;justify-content:space-between;gap:10px}
.pay div span:last-child{font-weight:800;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:4px}
.pay div span:last-child svg{width:15px;height:15px}
.pay .tot{border-top:1.5px solid var(--line);padding-top:6px;margin-top:2px;font-weight:800;color:var(--gold)}
.up{background:linear-gradient(100deg,#b3170f,#ff6b1a);border-radius:12px;padding:10px 14px;text-align:center;font-weight:800}
.up b{font-family:var(--display);font-size:30px;display:block;line-height:1}
.newb{display:flex;gap:10px;align-items:center;background:var(--chip);border:1.5px solid var(--gold);border-radius:12px;padding:8px 12px}
.newb svg{width:30px;height:auto;flex:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* desktop: stage beside the content */
@media (min-width:940px){
  .wrap{max-width:1200px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);column-gap:28px;align-items:start}
  .wrap.solo{max-width:700px;grid-template-columns:minmax(0,1fr)}
  #pre{grid-column:1/-1}
  #stage,#stage.run{position:sticky;top:16px}
  #gl{aspect-ratio:16/10}
  .brand h1{font-size:64px}
}</style>

<div class="wrap" dir="rtl">
  <div id="pre"></div>
  <div id="stage"><canvas id="gl"></canvas><div id="hud"></div><div id="obn"></div><div id="cap"></div></div>
  <div id="app" style="display:flex;flex-direction:column;gap:14px"></div>
</div>
<div id="modal" dir="rtl" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const app=$('#app');
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>n.toLocaleString('en-US');
const N=n=>`<span class="num">${fmt(n)}</span>`;
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const MX=(w,n,d)=>`<span class="mx">${w?`<span>${w}</span>`:''}${n?F(n,d):''}${!w&&!n?'0':''}</span>`;
const BOX='<span class="box">?</span>';
const parseNum=s=>{s=String(s).replace(/[,\s.]/g,'');return /^\d+$/.test(s)?+s:null};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- pictures ---------- */
const svgOpen=(w,h,pad=4,extra='')=>`<svg viewBox="${-pad} ${-pad} ${w+2*pad} ${h+2*pad}" width="${w+2*pad}" xmlns="http://www.w3.org/2000/svg" font-family="Rubik,sans-serif" font-weight="700" ${extra}>`;
function wedge(cx,cy,r,a0,a1){
  const p=a=>[cx+r*Math.cos(a*Math.PI/180),cy+r*Math.sin(a*Math.PI/180)],[x0,y0]=p(a0),[x1,y1]=p(a1);
  return `M${cx} ${cy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z`;
}
function pizza(cx,cy,r,d,filled){
  let s=`<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:var(--plate);stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 3"/>`;
  if(d===1&&filled){s+=`<circle cx="${cx}" cy="${cy}" r="${r}" style="fill:var(--crust)"/><circle cx="${cx}" cy="${cy}" r="${r-4}" style="fill:var(--cheese)"/>`;
    [[0,-.45],[.4,.25],[-.4,.25]].forEach(([a,b])=>s+=`<circle cx="${cx+a*r}" cy="${cy+b*r}" r="3.6" style="fill:var(--pepp)"/>`);return s;}
  for(let j=0;j<filled;j++){const a0=-90+j*360/d,a1=a0+360/d,m=(a0+a1)/2*Math.PI/180;
    s+=`<path d="${wedge(cx,cy,r,a0,a1)}" style="fill:var(--crust)"/><path d="${wedge(cx,cy,r-4,a0,a1)}" style="fill:var(--cheese)"/>`;
    s+=`<circle cx="${(cx+Math.cos(m)*r*.58).toFixed(1)}" cy="${(cy+Math.sin(m)*r*.58).toFixed(1)}" r="${d>6?2.6:3.4}" style="fill:var(--pepp)"/>`;}
  if(d>1)for(let j=0;j<d;j++){const a=(-90+j*360/d)*Math.PI/180;s+=`<line x1="${cx}" y1="${cy}" x2="${(cx+Math.cos(a)*r).toFixed(2)}" y2="${(cy+Math.sin(a)*r).toFixed(2)}" style="stroke:var(--surface);stroke-width:1.6"/>`;}
  return s;
}
function pizzas(n,d){
  const units=Math.max(1,Math.ceil(n/d)),r=27,g=12,W=units*(2*r+g)-g;
  let s=svgOpen(W,2*r+20);
  for(let u=0;u<units;u++){const f=Math.max(0,Math.min(d,n-u*d)),cx=r+u*(2*r+g);
    s+=pizza(cx,r,r,d,f)+`<text x="${cx}" y="${2*r+16}" text-anchor="middle" font-size="12" style="fill:var(--muted)">${f===d?'1':f+'/'+d}</text>`;}
  return `<div class="pic">${s}</svg></div>`;
}
const bars=pizzas;
function numline(n,d,max){
  max=max||Math.ceil(n/d)+1;const W=300,x0=12,u=(W-24)/max,X=v=>x0+v*u;
  let s=svgOpen(W,62);
  s+=`<line x1="${x0}" y1="40" x2="${W-8}" y2="40" style="stroke:var(--ink);stroke-width:2.5"/>`;
  for(let k=0;k<=max*d;k++){const big=k%d===0;s+=`<line x1="${X(k/d)}" y1="${big?31:35}" x2="${X(k/d)}" y2="${big?49:45}" style="stroke:var(--ink);stroke-width:${big?2.5:1.2}"/>`;
    if(big)s+=`<text x="${X(k/d)}" y="62" text-anchor="middle" font-size="14" style="fill:var(--ink)">${k/d}</text>`;}
  const m=X(n/d);
  s+=`<rect x="${X(Math.floor(n/d))}" y="36" width="${u}" height="8" rx="4" style="fill:var(--gold);opacity:.55"/>`;
  s+=`<path d="M${m-7} 14h14l-7 11z" style="fill:var(--red)"/><text x="${m}" y="9" text-anchor="middle" font-size="13" style="fill:var(--red)">${n}/${d}</text>`;
  return `<div class="pic">${s}</svg></div>`;
}
function area(a,p,q,hide){
  const b=p+q,W=280,cw=W/b,rh=13,gap=1.6;
  const rows=a<=8?[...Array(a).keys()].map(i=>({i,y:i*rh})):[0,1,2,3].map(i=>({i,y:i*rh})).concat([a-2,a-1].map((i,k)=>({i,y:(4+k)*rh+22})));
  const H=a<=8?a*rh:6*rh+22;
  let s=svgOpen(W,H).replace(/viewBox="[^"]+"/,`viewBox="-80 -28 ${W+86} ${H+36}"`).replace(/width="\d+(\.\d+)?"/,`width="${W+86}"`);
  for(const r of rows)for(let c=0;c<b;c++){
    if(hide&&c>=p)continue;
    s+=`<rect x="${(c*cw+gap/2).toFixed(2)}" y="${r.y+gap/2}" width="${(cw-gap).toFixed(2)}" height="${rh-gap}" rx="1.5" style="fill:${c<p?'var(--red)':'var(--gold)'}"/>`;}
  if(hide)s+=`<rect x="${p*cw+2}" y="1" width="${q*cw-3}" height="${H-2}" rx="4" style="fill:var(--chip);stroke:var(--red);stroke-width:2;stroke-dasharray:6 4"/>`;
  if(a>8){const y=4*rh+11;s+=`<text x="${(hide?p:b)*cw/2}" y="${y+5}" text-anchor="middle" font-size="16" style="fill:var(--muted)">⋮</text>`;
    s+=`<text x="-10" y="${y+5}" text-anchor="end" font-size="11" style="fill:var(--muted)">עוד ${a-6}</text>`;}
  s+=`<text x="${p*cw/2}" y="-9" text-anchor="middle" font-size="14" style="fill:var(--ink)">${p} עמודות</text><text x="${p*cw+q*cw/2}" y="-9" text-anchor="middle" font-size="14" style="fill:${hide?'var(--red)':'var(--ink)'}">${hide?'?':q+' עמודות'}</text>`;
  s+=`<line x1="-6" y1="0" x2="-6" y2="${H}" style="stroke:var(--ink);stroke-width:1.5"/><text x="-12" y="${H/2+5}" text-anchor="end" font-size="14" style="fill:var(--ink)">${a} שורות</text>`;
  const lbl=(x,t)=>`<rect x="${x-32}" y="${H/2-13}" width="64" height="24" rx="12" style="fill:var(--surface);opacity:.95"/><text x="${x}" y="${H/2+5}" text-anchor="middle" font-size="14" style="fill:var(--ink)">${t}</text>`;
  s+=lbl(p*cw/2,fmt(a*p))+(hide?`<text x="${p*cw+q*cw/2}" y="${H/2+9}" text-anchor="middle" font-size="26" style="fill:var(--red)">?</text>`:lbl(p*cw+q*cw/2,fmt(a*q)));
  return `<div class="pic">${s}</svg></div>`;
}
function rect(a,b,mode){
  const c=22,w=b*c,h=a*c;
  let s=svgOpen(w+44,h+40).replace(/viewBox="[^"]+"/,`viewBox="-34 -26 ${w+60} ${h+44}"`);
  if(mode==='area')for(let i=0;i<a;i++)for(let j=0;j<b;j++)s+=`<rect x="${j*c+1.5}" y="${i*c+1.5}" width="${c-3}" height="${c-3}" rx="3" style="fill:var(--shade)"/>`;
  for(let i=0;i<=b;i++)s+=`<line x1="${i*c}" y1="0" x2="${i*c}" y2="${h}" style="stroke:var(--line)"/>`;
  for(let j=0;j<=a;j++)s+=`<line x1="0" y1="${j*c}" x2="${w}" y2="${j*c}" style="stroke:var(--line)"/>`;
  s+=`<rect x="0" y="0" width="${w}" height="${h}" style="fill:none;stroke:${mode==='per'?'var(--wood)':'var(--accent)'};stroke-width:${mode==='per'?6:3};${mode==='per'?'stroke-dasharray:10 3':''}"/>`;
  s+=`<text x="${w/2}" y="-8" text-anchor="middle" font-size="14" style="fill:var(--ink)">${b}</text><text x="-8" y="${h/2+5}" text-anchor="end" font-size="14" style="fill:var(--ink)">${a}</text>`;
  if(mode==='per')s+=`<text x="${w/2}" y="${h+18}" text-anchor="middle" font-size="14" style="fill:var(--ink)">${b}</text><text x="${w+8}" y="${h/2+5}" font-size="14" style="fill:var(--ink)">${a}</text>`;
  return `<div class="pic">${s}</svg></div>`;
}
function schem(a,inside,mode){
  const W=210,H=96;
  let s=svgOpen(W+60,H+30).replace(/viewBox="[^"]+"/,`viewBox="-56 -26 ${W+64} ${H+34}"`);
  s+=`<rect x="0" y="0" width="${W}" height="${H}" style="fill:${mode==='area'?'var(--shade)':'var(--surface)'};stroke:${mode==='area'?'var(--accent)':'var(--wood)'};stroke-width:${mode==='area'?3:7};${mode==='area'?'':'stroke-dasharray:12 4'}"/>`;
  s+=`<text x="-10" y="${H/2+5}" text-anchor="end" font-size="15" style="fill:var(--ink)">${a} ס"מ</text><text x="${W/2}" y="-9" text-anchor="middle" font-size="20" style="fill:var(--red)">?</text>`;
  s+=`<rect x="${W/2-62}" y="${H/2-15}" width="124" height="28" rx="14" style="fill:var(--surface);opacity:.92"/><text x="${W/2}" y="${H/2+5}" text-anchor="middle" font-size="14" style="fill:var(--ink)">${inside}</text>`;
  return `<div class="pic">${s}</svg></div>`;
}
function colsub(X,Y){
  const a=String(X).split('').map(Number),L=a.length,b=String(Y).padStart(L,'0').split('').map(Number),cur=[...a],chg=Array(L).fill(false),res=Array(L).fill(0);
  for(let i=L-1;i>=0;i--){
    if(cur[i]<b[i]){let j=i-1;while(cur[j]===0)j--;cur[j]--;chg[j]=true;for(let k=j+1;k<i;k++){cur[k]=9;chg[k]=true;}cur[i]+=10;chg[i]=true;}
    res[i]=cur[i]-b[i];
  }
  const rs=res.join('').replace(/^0+(?=\d)/,''),off=L-rs.length;
  const g=i=>(L-i)%3===0&&i>0?' class="gp"':'';
  return `<div class="pic"><table class="col sm"><tr class="br">${cur.map((v,i)=>`<td${g(i)}>${chg[i]?v:''}</td>`).join('')}<td></td></tr>
   <tr>${a.map((v,i)=>`<td${g(i)}>${chg[i]?`<s>${v}</s>`:v}</td>`).join('')}<td></td></tr>
   <tr>${b.map((v,i)=>`<td${g(i)}>${i<L-String(Y).length?'':v}</td>`).join('')}<td class="sfx">−</td></tr>
   <tr class="res">${res.map((v,i)=>`<td${g(i)}>${i<off?'':v}</td>`).join('')}<td></td></tr></table></div>`;
}
const ICON_ITEM={
  ball:`<circle cx="14" cy="14" r="12" style="fill:var(--surface);stroke:var(--ink);stroke-width:2"/><path d="M14 7l5 4-2 6h-6l-2-6z" style="fill:var(--ink)"/>`,
  book:`<rect x="4" y="3" width="20" height="23" rx="2" style="fill:var(--accent)"/><rect x="7" y="7" width="13" height="3" style="fill:var(--surface)"/>`,
  shirt:`<path d="M9 3l5 3 5-3 7 5-3 5-3-2v15H8V11l-3 2-3-5z" style="fill:var(--red)"/><text x="14" y="20" text-anchor="middle" font-size="8" style="fill:#fff">10</text>`
};
function shopPic(L,H,n,money,icon){
  const tag=(x,t)=>`<g transform="translate(${x} 4)"><path d="M0 0h52l14 16-14 16H0z" style="fill:var(--gold)"/><circle cx="56" cy="16" r="3" style="fill:var(--surface)"/><text x="26" y="21" text-anchor="middle" font-size="15" style="fill:var(--gold-ink)">₪${t}</text></g>`;
  let s=svgOpen(300,92);
  s+=tag(0,L)+`<text x="86" y="25" text-anchor="middle" font-size="13" style="fill:var(--muted)">עד</text>`+tag(104,H);
  for(let i=0;i<n;i++)s+=`<g transform="translate(${4+i*34} 52)">${ICON_ITEM[icon]}</g>`;
  s+=`<text x="${8+n*34}" y="72" font-size="13" style="fill:var(--muted)">× ${n}</text>`;

function rangePic(lo,hi,money){

/* ---------- question helpers ---------- */
function choice(el,html,opts,explain,cls=''){
  el.innerHTML=html+`<div class="opts ${cls}">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.html}</button>`).join('')}</div>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.i];
    el.querySelectorAll('.opt').forEach(x=>{if(opts[+x.dataset.i].ok)x.classList.add('right')});
    if(!o.ok)b.classList.add('wrong');
    answer(o.ok,explain);
  });
}
function numInput(el,html,ans,explain,hint='',pad){
  el.innerHTML=html+`<div class="inrow"><input id="in" inputmode="numeric" autocomplete="off" placeholder="?" aria-label="תשובה"><button class="go" id="chk">בדיקה</button></div>${hint?`<p class="hint">${hint}</p>`:''}${pad?'<button class="ghost padbtn" type="button" id="padb">לחשב על דף</button><div id="padw" class="padw" hidden></div>':''}`;
  if(pad){const b=$('#padb'),w=$('#padw');b.onclick=()=>{SFX.click();if(!w.innerHTML){w.innerHTML=padHTML(pad.op,pad.a,pad.b);wirePad(w)}w.hidden=!w.hidden;b.textContent=w.hidden?'לחשב על דף':'להסתיר את הדף';
    if(!w.hidden){const all=w.querySelectorAll('.pad input[data-r="'+(w.querySelector('[data-r="p0"]')?'p0':'res')+'"]');if(all.length)all[all.length-1].focus();w.scrollIntoView({behavior:'smooth',block:'nearest'})}}}
  const go=()=>{const v=parseNum($('#in').value);if(v===null){$('#in').focus();return;}
    answer(v===ans,(v===ans?'':`כתבת ${N(v)}. `)+explain);};
  $('#chk').onclick=go;$('#in').onkeydown=e=>{if(e.key==='Enter')go()};
}
const dedupe=opts=>{const seen=new Set();return opts.filter(o=>{if(seen.has(o.key))return false;seen.add(o.key);return true})};

/* ---------- paper workpad: the child writes every digit, nothing is computed ---------- */
function padHTML(op,a,b){
  const A=String(a),B=String(b),mul=op==='×',W=mul?A.length+B.length:Math.max(A.length,B.length)+(op==='+'?1:0);
  const E='<i></i>',lp=s=>Array(W-s.length).fill('').concat(s.split(''));
  const inRow=(cls,r,ml)=>Array.from({length:W},(_,c)=>`<input class="${cls}" data-r="${r}" data-c="${c}" inputmode="numeric" maxlength="${ml}" autocomplete="off" aria-label="ספרה">`);
  let h=[E].concat(inRow('s','c',2)).join('');
  h+=[E].concat(lp(A).map(d=>d===''?E:(op==='-'?`<button class="d" type="button">${d}</button>`:`<span class="d">${d}</span>`))).join('');
  h+=[`<span class="op">${op==='-'?'−':op}</span>`].concat(lp(B).map(d=>d===''?E:`<span class="d">${d}</span>`)).join('');
  h+='<div class="ln"></div>';
  if(mul&&B.length>1){for(let i=0;i<B.length;i++)h+=[i===B.length-1?'<span class="op">+</span>':E].concat(inRow('','p'+i,1)).join('');h+='<div class="ln"></div>'}
  h+=[E].concat(inRow('','res',1)).join('');
  return `<div class="pad" style="grid-template-columns:repeat(${W+1},var(--cw))">${h}</div>
   <p class="hint">${mul&&B.length>1?'כופלים בכל ספרה בנפרד, כל שורה במקום משלה, ומחברים את השורות.':op==='-'?'נוגעים בספרה כדי למחוק אותה כשפורטים, וכותבים את המספר החדש במשבצת הקטנה מעליה.':'המשבצות הקטנות למעלה הן בשביל מה שעובר לטור הבא.'} מתחילים מימין.</p>
   <div class="lnav"><button class="ghost" type="button" data-pa="clr">ניקוי</button><button class="go" type="button" data-pa="use">להעביר לתשובה</button></div><p class="hint" data-pa="msg"></p>`;
}
function padRead(cells){
  const f=cells.findIndex(v=>v);if(f<0)return {err:'עוד לא כתבת תוצאה בשורה התחתונה'};
  let l=cells.length-1;while(!cells[l])l--;
  if(l!==cells.length-1)return {err:'התוצאה מתחילה מהמשבצת הימנית ביותר'};
  if(cells.slice(f).some(v=>!v))return {err:'יש משבצת ריקה באמצע התוצאה'};
  return {v:+cells.slice(f).join('')};
}
function wirePad(w){
  const cell=(r,c)=>w.querySelector(`.pad input[data-r="${r}"][data-c="${c}"]`),msg=t=>{w.querySelector('[data-pa="msg"]').textContent=t};
  w.querySelectorAll('.pad input').forEach(inp=>{
    inp.addEventListener('input',()=>{const ml=+inp.getAttribute('maxlength');let v=inp.value.replace(/\D/g,'');v=ml>1?v.slice(0,ml):v.slice(-1);inp.value=v;
      if(v&&ml===1){const p=cell(inp.dataset.r,+inp.dataset.c-1);if(p)p.focus()}});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();return}
      if(e.key==='Backspace'&&!inp.value){const n=cell(inp.dataset.r,+inp.dataset.c+1);if(n){n.focus();e.preventDefault()}}});
  });
  w.querySelectorAll('.pad button.d').forEach(b=>b.onclick=()=>{b.classList.toggle('x');SFX.click()});
  w.querySelector('[data-pa="clr"]').onclick=()=>{w.querySelectorAll('.pad input').forEach(i=>i.value='');w.querySelectorAll('.pad .x').forEach(b=>b.classList.remove('x'));msg('');SFX.click()};
  w.querySelector('[data-pa="use"]').onclick=()=>{const r=padRead([...w.querySelectorAll('.pad input[data-r="res"]')].map(i=>i.value));
    if(r.err){msg(r.err);SFX.bad();return}const i=$('#in');i.value=fmt(r.v);msg('התוצאה עברה לתשובה. עכשיו לוחצים על "בדיקה".');SFX.click();i.scrollIntoView({behavior:'smooth',block:'center'})};
}
function coladd(X,Y){
  const a=String(X),b=String(Y),L=Math.max(a.length,b.length)+1,A=a.padStart(L,'0').split('').map(Number),B=b.padStart(L,'0').split('').map(Number),car=Array(L).fill(0),res=Array(L).fill(0);
  for(let i=L-1;i>=0;i--){const s=A[i]+B[i]+car[i];res[i]=s%10;if(i>0)car[i-1]=Math.floor(s/10)}
  const rs=String(X+Y),oa=L-a.length,ob=L-b.length,or=L-rs.length;
  return `<div class="pic"><table class="col sm"><tr class="br">${car.map(c=>`<td>${c||''}</td>`).join('')}<td></td></tr>
   <tr>${A.map((d,i)=>`<td>${i<oa?'':d}</td>`).join('')}<td></td></tr>
   <tr>${B.map((d,i)=>`<td>${i<ob?'':d}</td>`).join('')}<td class="sfx">+</td></tr>
   <tr class="res">${res.map((d,i)=>`<td>${i<or?'':d}</td>`).join('')}<td></td></tr></table></div>`;
}
function colmul(a,b){
  const A=String(a),B=String(b),tot=a*b,parts=B.split('').reverse().map((d,i)=>String(a*+d)+'0'.repeat(i)),L=Math.max(String(tot).length,A.length,B.length,...parts.map(s=>s.length));
  const row=(s,sfx,cls)=>`<tr class="${cls||''}">${Array.from({length:L},(_,i)=>{const k=i-(L-s.length);return `<td>${k<0?'':s[k]}</td>`}).join('')}<td class="sfx">${sfx||''}</td></tr>`;
  let h=row(A)+row(B,'×');
  if(B.length>1){parts.forEach((s,i)=>{const z=i,body=s.slice(0,s.length-z);
    h+=`<tr class="${i===0?'res':''}">${Array.from({length:L},(_,c)=>{const k=c-(L-s.length);return k<0?'<td></td>':`<td class="${k>=body.length?'z':''}">${s[k]}</td>`}).join('')}<td class="sfx">${i===parts.length-1?'+':''}</td></tr>`});
    h+=row(String(tot),'','res')}
  else h+=row(String(tot),'','res');
  return `<div class="pic"><table class="col sm">${h}</table></div>`;
}

function runPose(ph){

function rootYaw(p,gx,gy,gz){const o=rootOff(p);return {x:gx,y:gy-o.y,z:gz+o.x}}
function gripYaw(gx,gy,gz,p){setPose(p);const r=rootYaw(p,gx,gy,gz);at(r.x,r.y,r.z);A.root.rotation.y=Math.PI/2}
const blend3=(a,m,b,k)=>k<.5?mixP(a,m,k*2):mixP(m,b,k*2-1);

const X=()=>A.root.position.x,Y=()=>A.root.position.y,Z=()=>A.root.position.z;

function frame(now){
  requestAnimationFrame(frame);
  if(!G.ok||G.mode==='off'||document.hidden){G.last=now;return}
  const dt=Math.min(.05,Math.max(0,(now-(G.last||now))/1000));G.last=now;G.t+=dt;const t=G.t;
  try{
    if(G.tw.length){for(const w of G.tw.slice()){w.t+=G.fast?1e3:dt;const k=Math.min(1,w.t/w.d);
      try{w.fn(w.e(k))}catch(e){w.t=1e9}
      if(k>=1||w.t>=1e9){const i=G.tw.indexOf(w);if(i>=0)G.tw.splice(i,1);w.res()}}}
    if(!G.running&&A.root.visible){
      if(G.dance&&DANCE[G.dance]){const d=DANCE[G.dance](t);setPose(d.p);at(G.base.x,G.base.y+(d.dy||0),0);A.root.rotation.y=-Math.PI/2+(d.yaw||0)}
      else if(G.mode==='show'){const p=pose(P.STAND);p.y=Math.sin(t*2)*.012;p.sL=p.sR=.06+Math.sin(t*2)*.03;setPose(p);at(SHOWX,0,0);A.root.rotation.y=-Math.PI/2+Math.sin(t*.6)*.75+G.spin}
      else{const p=pose(P.STAND);p.y=Math.sin(t*2.2)*.012;p.sL=p.sR=.06+Math.sin(t*2.2)*.03;setPose(p)}
    }
    animBody(G.fast?0:dt,t);
    if(A.acc.cape.visible){const vx=Math.abs(X()-(G.px===undefined?X():G.px))/Math.max(dt,.001);G.px=X();const tg=Math.min(1.3,.14+vx*.11)+Math.sin(t*6)*.04;
      G.capeA=(G.capeA||.14)+(tg-(G.capeA||.14))*Math.min(1,dt*6);A.acc.cape.rotation.z=-G.capeA}
    for(const o of G.obs)if(o.tick)o.tick(dt,t);
    // camera
    const show=G.mode==='show',tx=show?SHOWX:X()+2.3;G.camX+=(tx-G.camX)*(1-Math.exp(-dt*5));const cx=G.camX;
    const ty=show?0:Math.max(0,Math.min(3.2,Y()))*.74;G.camY+=(ty-G.camY)*(1-Math.exp(-dt*4));const cy=G.camY;
    if(show){G.cam.position.set(cx,1.4,5.3);G.cam.lookAt(cx,.8,0)}else{G.cam.position.set(cx-.6,3.1+cy,9.7+cy*.35);G.cam.lookAt(cx+.2,1.15+cy,0)}
    G.sun.position.set(cx+5,11,8);G.sun.target.position.set(cx,0,0);G.rim.position.set(cx-4,3.5,-4);G.rim2.position.set(cx+5,3,-3);
    G.back.position.x=cx*.86;
    for(const g of G.glints){g.m.position.x=cx-20+(((g.ox-cx)%40)+40)%40;g.m.material.opacity=.12+.22*(.5+.5*Math.sin(t*1.7+g.ph))}
    G.beams.forEach((bm,i)=>{bm.rotation.z=Math.sin(t*.5+i*1.3)*.32;bm.rotation.x=-.3-Math.sin(t*.37+i)*.1});
    if(Math.random()<.35){const i=Math.floor(Math.random()*18),fp=G.flash.pos;fp[i*3]=(Math.random()-.5)*46+(cx-G.back.position.x);fp[i*3+1]=1.6+Math.random()*5.6;fp[i*3+2]=-10.4-Math.random()*3.5;
      const k=Math.floor(Math.random()*18);fp[k*3+1]=-999;G.flash.geo.attributes.position.needsUpdate=true}
    for(const jt of G.jets){jt.t-=dt;G.fire.emit(jt.x,jt.y,jt.z,{n:7,sp:.7,up:10,life:.5,g:5,r:.15,colors:[0xffd23d,0xff8a1a,0xff4b1a]})}
    if(G.jets.length)G.jets=G.jets.filter(j=>j.t>0);
    G.water.step(dt);G.fire.step(dt);
    for(const q of G.rings){if(q.t>=1){q.m.material.opacity=0;continue}q.t+=dt/.9;const s=1+q.t*5;q.m.scale.set(s,s,s);q.m.material.opacity=.75*(1-q.t)}

    CAM.raf=requestAnimationFrame(loop);
    const st=q$('#cz');if(!st||!R){camStop();return}
    const dt=Math.min(.1,(t-prevT)/1000);prevT=t;
    try{if(!useMouse)readHand()}catch(e){console.log(e)}
    const msg=q$('#cz-msg');
    if(raw){ptr=ptr?{x:ptr.x+(raw.x-ptr.x)*Math.min(1,dt*14),y:ptr.y+(raw.y-ptr.y)*Math.min(1,dt*14)}:{...raw};msg.textContent=''}
    else{ptr=null;if(!useMouse)msg.textContent='מרימים יד מול המצלמה'}
    const r=cv.getBoundingClientRect();if(cv.width!==Math.round(r.width*devicePixelRatio)){cv.width=Math.round(r.width*devicePixelRatio);cv.height=Math.round(r.height*devicePixelRatio)}
    cx.clearRect(0,0,cv.width,cv.height);
    let hot=null;const bubs=[...q$('#cz-bubs').children];
    if(ptr&&!R.lock)for(const el of bubs){const b=el.getBoundingClientRect(),bx=b.left+b.width/2-r.left,by=b.top+b.height/2-r.top;
      if(Math.hypot(ptr.x*r.width-bx,ptr.y*r.height-by)<b.width*.62&&R.dw.get(el)!==-1)hot=el}
    for(const el of bubs){let p=R.dw.get(el)||0;if(p<0){el.style.setProperty('--p',0);continue}
      p=el===hot?p+dt/DWELL*((useMouse?mouseDown:fist)?1.7:1):Math.max(0,p-dt*2);R.dw.set(el,p);el.style.setProperty('--p',Math.min(1,p));el.classList.toggle('hot',el===hot);
      if(el===hot){tickAcc+=dt;if(tickAcc>.1){tickAcc=0;tone(1500,.03,'square',.02)}}
      if(p>=1&&!R.lock){R.dw.set(el,0);choose(el)}}
    drawFx(dt);
    if(ptr){const x=ptr.x*cv.width,y=ptr.y*cv.height,s=devicePixelRatio,f=useMouse?mouseDown:fist;
      cx.beginPath();cx.arc(x,y,40*s,0,Math.PI*2);cx.fillStyle=f?'rgba(255,107,26,.3)':'rgba(255,197,61,.22)';cx.fill();drawHand(x,y,s*(f?.95:1.1),f)}
  }
  return {open};
})();
function gCam(){CamGame.open()}

function gQuick(){
  let ok=0,n=0,left=60,lock=false;
  mgFrame('בזק',`<div class="xp" id="tbar"><i style="width:100%"></i></div><div class="card"><div class="mq" id="mq"></div><div class="opts two" id="mo"></div></div>`);
  const next=()=>{const [a,b]=pickFact(),c=a*b,opts=shuffle([c,...wrongs(a,b,3)]);lock=false;
    $('#mq').innerHTML=`<span class="ltr">${a} × ${b}</span>`;
    $('#mo').innerHTML=opts.map(v=>`<button class="opt" data-v="${v}">${v}</button>`).join('');
    $('#mo').querySelectorAll('.opt').forEach(bn=>bn.onclick=()=>{if(lock)return;lock=true;const good=+bn.dataset.v===c;n++;recFact(a,b,good);
      if(good){ok++;bn.classList.add('right');SFX.good();gemTick(ok);later(next,220)}
      else{bn.classList.add('wrong');SFX.bad();$('#mo').querySelectorAll('.opt').forEach(x=>{if(+x.dataset.v===c)x.classList.add('right')});later(next,1200)}})};
  MG.timers.push(setInterval(()=>{left-=.1;const i=$('#tbar i');if(i)i.style.width=Math.max(0,left/60*100)+'%';if(left<=0)mgEnd('בזק',ok,n,undefined,gQuick)},100));
  next();
}
function gTF(){
  let i=0,ok=0,lock=false;const N=12;
  mgFrame('נכון או לא נכון',`<div class="card"><div class="qtag" id="cnt"></div><div class="mq" id="mq"></div><div class="opts two"><button class="opt" id="ty">נכון</button><button class="opt" id="tn">לא נכון</button></div><div id="tfb" class="eqs" style="min-height:1.6em"></div></div>`);
  const next=()=>{if(i>=N)return mgEnd('נכון או לא נכון',ok,N,undefined,gTF);
    const [a,b]=pickFact(),c=a*b,truth=Math.random()<.5,shown=truth?c:wrongs(a,b,1)[0];lock=false;
    $('#cnt').textContent=`תרגיל ${i+1} מתוך ${N}`;$('#mq').innerHTML=`<span class="ltr">${a} × ${b} = ${shown}</span>`;$('#tfb').textContent='';
    $('#ty').className=$('#tn').className='opt';
    const ans=(v,el)=>{if(lock)return;lock=true;const good=v===truth;recFact(a,b,good);i++;
      if(good){ok++;el.classList.add('right');SFX.good();gemTick(ok);later(next,350)}
      else{el.classList.add('wrong');SFX.bad();$('#tfb').textContent=`${a} × ${b} = ${c}`;later(next,1700)}};
    $('#ty').onclick=()=>ans(true,$('#ty'));$('#tn').onclick=()=>ans(false,$('#tn'))};
  next();
}
function gMem(){
  const facts=[],seen=new Set();let guard=0;
  while(facts.length<6&&guard++<300){const [a,b]=pickFact(),c=a*b;if(seen.has(c))continue;seen.add(c);facts.push([a,b])}
  const cards=shuffle(facts.flatMap(([a,b],k)=>[{k,t:`${a} × ${b}`},{k,t:String(a*b)}]));
  let open=[],done=0,tries=0,lock=false;
  mgFrame('זוגות',`<p class="hint">הופכים שני קלפים ומחפשים תרגיל ואת התשובה שלו</p><div class="mem">${cards.map((c,i)=>`<button class="mc" data-i="${i}"><span class="ltr">${c.t}</span></button>`).join('')}</div>`);
  app.querySelectorAll('.mc').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;if(lock||el.classList.contains('up'))return;el.classList.add('up');SFX.click();open.push([i,el]);
    if(open.length<2)return;tries++;const [[i1,e1],[i2,e2]]=open,f=facts[cards[i1].k];open=[];
    if(cards[i1].k===cards[i2].k){recFact(f[0],f[1],true);e1.classList.add('ok');e2.classList.add('ok');SFX.good();done++;gemTick(done);
      if(done===facts.length)later(()=>mgEnd('זוגות',done,facts.length,tries<=9?3:0,gMem),700)}
    else{lock=true;SFX.bad();later(()=>{e1.classList.remove('up');e2.classList.remove('up');lock=false},900)}});
}
function gBal(){
  let i=0,ok=0;const N=10,COL=['#ff6b1a','#27d3f5','#ffc53d','#3ddc84','#ff5a8f'];
  mgFrame('בלונים',`<div class="card"><div class="qtag" id="cnt"></div><p class="qtext" style="text-align:center">איזה בלון שווה לתרגיל?</p><div class="mq" id="mq"></div><div class="bal" id="bl"></div></div>`);
  const next=()=>{if(i>=N)return mgEnd('בלונים',ok,N,undefined,gBal);
    const [a,b]=pickFact(),c=a*b,opts=shuffle([c,...wrongs(a,b,4)]);let first=true,lock=false;
    $('#cnt').textContent=`בלון ${i+1} מתוך ${N}`;$('#mq').innerHTML=`<span class="ltr">${a} × ${b}</span>`;
    $('#bl').innerHTML=opts.map((v,k)=>`<button class="bn" style="--c:${COL[k]};animation-delay:${-k*.45}s" data-v="${v}">${v}</button>`).join('');
    $('#bl').querySelectorAll('.bn').forEach(el=>el.onclick=()=>{if(lock)return;
      if(+el.dataset.v===c){lock=true;recFact(a,b,first);if(first)ok++;el.classList.add('pop');tone(900,.08,'square',.05,1800);gemTick(ok);i++;later(next,450)}
      else{first=false;el.classList.add('dud');el.disabled=true;SFX.bad()}})};
  next();
}

/* ---------- lesson ---------- */
function topbar(title){return `<div class="top"><button class="hb" id="back" aria-label="חזרה למפה">${XIC}</button><h2>${title}</h2>${muteBtn()}</div>`}
function openLesson(id){L={c:COURSE.find(x=>x.id===id),i:0};stageMode('off');renderLesson()}
function renderLesson(){
  const {c,i}=L,ls=LESSONS[c.id],sl=ls[i],last=i===ls.length-1,seen=ST.best[c.id]!=null;
  app.innerHTML=topbar(c.name)+
   (i===0?`<div class="story-card"><div class="label">תדריך לפני המכשול</div><p>${c.story}</p></div>`:'')+
   `<div class="card"><div class="qtag">אימון · ${i+1} מתוך ${ls.length}</div><h2 class="lt">${sl.t}</h2><div class="lbody">${sl.h}</div></div>
   <div class="dots">${ls.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div>
   <div class="lnav">${i?'<button class="ghost" id="prev">הקודם</button>':''}<button class="big" id="nextl">${last?'למסלול!':'הבא'}</button></div>
   ${seen&&!last?`<button class="link" id="skip">אני כבר ${gx('יודע','יודעת')}, ישר למסלול</button>`:''}`;
  $('#back').onclick=()=>{SFX.click();home()};wireMute();
  if(sl.init)sl.init(app.querySelector('.lbody'));
  $('#nextl').onclick=()=>{SFX.click();if(last)startRun(c.id);else{L.i++;renderLesson()}};
  if(i)$('#prev').onclick=()=>{SFX.click();L.i--;renderLesson()};
  const sk=$('#skip');if(sk)sk.onclick=()=>{SFX.click();startRun(c.id)};
  window.scrollTo(0,0);
}

/* ---------- run ---------- */
function startRun(id){
  let list=[];
  if(id==='boss'){const n=bossLen();for(let k=0;k<n;k++){const c=COURSE[k%COURSE.length];list.push([c.id,pick(c.gen)])}shuffle(list)}
  else{const c=COURSE.find(x=>x.id===id);for(let k=0;k<ST.len;k++)list.push([id,c.gen[k%c.gen.length]]);shuffle(list)}
  S={id,list,i:0,n:list.length,ok:0,coins:0,streak:0,maxStreak:0,res:[],tries:0};
  stageMode('run');$('#pre').innerHTML='';if(G.ok)buildCourse(S.n);
  SFX.whistle();renderQ();
}
function hudRun(done){
  const pips=S.list.map((_,i)=>`<i class="${(!done&&i===S.i)?'cur':S.res[i]===true?'ok':S.res[i]===false?'no':''}"></i>`).join('');
  $('#hud').innerHTML=`<div class="hrow"><button class="hb" id="back" aria-label="חזרה למפה">${XIC}</button><div class="pips">${pips}</div>${S.streak>=2?`<span class="chipc hot">${FLAME}<b>${S.streak}</b></span>`:''}<span class="chipc">${COIN}<b>${S.coins}</b></span>${muteBtn()}</div><div></div>`;
  $('#back').onclick=()=>{SFX.click();home()};wireMute();
}
function renderQ(){
  if(S.i>=S.n)return results();
  const [cid,g]=S.list[S.i],c=COURSE.find(x=>x.id===cid);
  hudRun();
  app.innerHTML=`<div class="card" id="card"><div class="qtag">${c.name} · מכשול ${S.i+1} מתוך ${S.n}${S.tries?' · ניסיון נוסף':''}</div><div id="q" style="display:flex;flex-direction:column;gap:14px"></div></div><div id="fbx"></div>`;
  g($('#q'));
  window.scrollTo(0,0);
}
function answer(ok,html){
  const run=S,idx=S.i,first=S.tries===0,last=ok&&idx===S.n-1;let gain=0;
  if(S.res[idx]===undefined)S.res[idx]=ok;
  if(ok){if(first){S.ok++;S.streak++;S.maxStreak=Math.max(S.maxStreak,S.streak);gain=10+(S.streak>=3?5:0)}else gain=5;S.i++;S.tries=0}
  else{S.streak=0;S.tries++}
  const streak=first?S.streak:0;
  $('#card').querySelectorAll('button,input').forEach(e=>e.disabled=true);
  const qd=$('#qdoor');if(qd){if(ok){qd.classList.add('open');setTimeout(SFX.open,250)}else qd.classList.add('shake')}
  const fbx=$('#fbx');let shown=false;
  const show=()=>{
    if(shown||S!==run||!fbx.isConnected)return;shown=true;
    S.coins+=gain;if(ok)SFX.coin();hudRun(true);
    fbx.innerHTML=`<div class="fb ${ok?'ok':'no'}"><h2>${ok?(first?pick(['מעבר נקי!','נחיתה מושלמת!','בול!',gx('כמו אלוף!','כמו אלופה!')]):pick(['עברת!','הפעם זה הצליח!','ככה עושים את זה!']))+` <small>+${gain}${gain>10?' בונוס רצף':''}</small>`:pick(['שפלאש! נפלת למים','אופס, רטוב!','כמעט עברת!'])}</h2>
      ${ok?'':`<p>${gx('המתמודד טיפס','המתמודדת טיפסה')} חזרה לתחילת המכשול. ${gx('בוא','בואי')} נבין מה קרה, ואז ננסה שאלה דומה:</p>`}<div>${html}</div>
      <button class="next" id="nx">${last?'לתוצאות':ok?'למכשול הבא':'לנסות שוב את המכשול'}</button>
      ${!ok&&S.id!=='boss'&&S.tries>=2?'<button class="link" id="rl2">לחזור לאימון של המכשול</button>':''}</div>`;
    $('#nx').onclick=()=>{SFX.click();if(G.running)G.fast=true;renderQ()};
    const rl=$('#rl2');if(rl)rl.onclick=()=>{SFX.click();openLesson(S.id)};
    fbx.firstChild.scrollIntoView({behavior:'smooth',block:'nearest'});
  };
  if(G.ok){
    fbx.innerHTML='<p class="wait">אפשר להקיש על המסלול כדי לדלג על ההנפשה</p>';
    if(reduce)G.fast=true;
    const p=G.seq=G.seq.then(()=>perform(idx,ok,streak,last)).catch(e=>{console.log(e)});
    Promise.race([p,new Promise(r=>setTimeout(r,last?15000:9000))]).then(show,show);
  }else{ok?SFX.good():SFX.bad();cap(ok?pick(OKCAP):pick(NOCAP),ok?'ok':'no');show()}
}
function results(){
  const n=S.n,p=S.ok/n,stars=p>=.99?3:p>=.66?2:p>=.33?1:0,boss=S.id==='boss';
  const bonus=[];
  if(S.ok===n)bonus.push(['ריצה נקייה',20]);
  if(!boss&&stars===3&&(ST.best[S.id]||0)<3)bonus.push(['3 כוכבים בפעם הראשונה',30]);
  const today=dayStr();if(ST.lastDay!==today){const y=new Date();y.setDate(y.getDate()-1);ST.days=ST.lastDay===dayStr(y)?(ST.days||0)+1:1;ST.lastDay=today;bonus.push(['בונוס אימון יומי',20])}
  const total=S.coins+bonus.reduce((a,b)=>a+b[1],0);ST.coins+=total;
  const r0=rankOf(ST.xp);ST.xp+=S.ok;const r1=rankOf(ST.xp);
  if(boss){if(ST.best.boss==null||S.ok>ST.best.boss)ST.best.boss=S.ok}else if(ST.best[S.id]==null||stars>ST.best[S.id])ST.best[S.id]=stars;
  const newB=[],give=id=>{if(!ST.badges[id]){ST.badges[id]=1;newB.push(BADGES.find(b=>b.id===id))}};
  if(S.ok===n)give('clean');if(S.maxStreak>=5)give('fire');if(boss&&S.ok>=n-2)give('buzzer');if(COURSE.every(c=>ST.best[c.id]>=3))give('stars');if(ST.days>=3)give('days');
  save();
  const idx=COURSE.findIndex(x=>x.id===S.id),nxt=boss?null:COURSE[idx+1],id=S.id,dn=SHOP.dance.items.find(d=>d.id===ST.dance);
  hudRun(true);
  app.innerHTML=`<div class="card">
    <div class="stars">${starsHtml(stars)}</div>
    <div class="res"><b>${S.ok} מעברים נקיים מתוך ${n}</b>${boss?'שלב הגמר':COURSE[idx].name} · מעבר נקי הוא מעבר בניסיון הראשון</div>
    <h2 style="font-size:30px;text-align:center">${stars===3?`עברת את המסלול ${gx('כמו אלוף','כמו אלופה')}!`:stars===2?'כמעט מושלם! עוד ריצה ל-3 כוכבים':'הגעת לבאזר! עוד ריצה תוסיף כוכבים'}</h2>
    <div class="pay"><div><span>מעברים ורצפים</span><span>${COIN}${S.coins}</span></div>${bonus.map(b=>`<div><span>${b[0]}</span><span>${COIN}${b[1]}</span></div>`).join('')}<div class="tot"><span>סך הכול בריצה</span><span>${COIN}${total}</span></div></div>
    ${r1>r0?`<div class="up">עלית דרגה!<b>${rankName(r1)}</b></div>`:''}
    ${newB.map(b=>`<div class="newb">${MEDAL(true)}<span><b>גביע חדש: ${b.n}</b><br><span style="color:var(--muted);font-size:14px">${b.d}</span></span></div>`).join('')}
    <p class="hint">ריקוד הניצחון: ${dn?dn.n:''}. ריקודים נוספים קונים ביהלומים מאימון לוח הכפל.</p>
    </div>
    <div class="btns">${nxt&&stars>=2?`<button class="big" id="nm">למכשול הבא: ${nxt.name}</button>`:''}
    <button class="${nxt&&stars>=2?'ghost':'big'}" id="again">עוד ריצה</button>
    ${stars<2&&!boss?'<button class="ghost" id="relearn">לחזור לאימון</button>':''}
    <button class="link" id="map">חזרה למפה ולחנות</button></div>`;
  if(stars>=2)SFX.win();
  if(r1>r0||newB.length)setTimeout(()=>SFX.cheer(1.6),500);
  const nm=$('#nm');if(nm)nm.onclick=()=>{SFX.click();openLesson(nxt.id)};
  $('#again').onclick=()=>{SFX.click();startRun(id)};
  const rl=$('#relearn');if(rl)rl.onclick=()=>{SFX.click();openLesson(id)};
  $('#map').onclick=()=>{SFX.click();home()};
  window.scrollTo(0,0);
}

G.ok=init3D();if(!G.ok)$('#stage').classList.add('no3d');
home();
</script>
